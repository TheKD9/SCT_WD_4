<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    
    <aside class="sidebar">
        <h2>To Do List</h2>
        <p class="subtitle">Stay organized, get things done</p>

        <div class="statsBox">
            <div><span id="totalTasks">0</span><small>Total</small></div>
            <div><span id="completedTasks">0</span><small>Completed</small></div>
            <div><span id="progressPercent">0%</span><small>Progress</small></div>
        </div>

        <div class="quickAdd">
            <input id="taskInput" placeholder="Quick add task">
            <button onclick="addTask()">+</button>
        </div>

        <div class="menu">
            <button onclick="setFilter('all')">📋 All Tasks</button>
            <button onclick="setFilter('today')">📅 Today</button>
            <button onclick="setFilter('completed')">✔ Completed</button>
        </div>
    </aside>

    
    <main class="main">
        <div class="topBar">
            <h1>Tasks</h1>
            <input type="datetime-local" id="date">
        </div>

        <ul id="taskList"></ul>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
